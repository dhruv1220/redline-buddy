name: homeowners-insurance
version: 1
description: Policyholder-side review of homeowners (HO-3 style) insurance policies.
rules:
  - id: anti-concurrent-causation
    title: Anti-concurrent causation exclusion
    severity: high
    description: The policy excludes any loss where a covered peril and an excluded peril combine to cause the damage.
    why: After a storm, wind (covered) and flood (excluded) almost always hit
      together. An anti-concurrent causation clause lets the insurer deny the
      entire claim even though a covered peril did most of the damage — this
      is how large numbers of post-hurricane claims were denied.
    suggestion: Strike the clause or narrow it so a covered peril that is
      the predominant cause of loss keeps the claim payable.
    fallback: "Where a covered peril is the predominant cause of a loss,
      coverage applies even if an excluded peril also contributed."
    check:
      kind: forbids_any
      patterns:
        - anti-concurrent causation
        - concurrent causation

  - id: dwelling-settled-at-acv
    title: Dwelling settled at actual cash value instead of replacement cost
    severity: high
    description: Coverage A (dwelling) claims are paid on an actual cash value basis — replacement cost minus depreciation.
    why: On a 20-year-old roof or 30-year-old structure, depreciation can
      erase 40–60% of the payout. You rebuild at today's prices but get
      reimbursed at decades-ago value, leaving a five-figure gap you pay
      out of pocket.
    suggestion: Require replacement-cost loss settlement for Coverage A
      (and ideally B), with no depreciation deduction once repairs complete.
    fallback: "Coverage A losses shall be settled at full replacement cost,
      without deduction for depreciation, upon completion of repairs."
    check:
      kind: requires_any
      patterns:
        - loss settlement.{0,80}replacement cost
        - dwelling.{0,60}replacement cost.{0,40}basis

  - id: percentage-wind-deductible
    title: Percentage-based windstorm/hurricane deductible
    severity: high
    description: The windstorm or hurricane deductible is a percentage of the dwelling limit rather than a flat dollar amount.
    why: A 2–5% deductible on an $800,000 dwelling is $16,000–$40,000 out of
      pocket for the most likely claim a coastal or tornado-belt homeowner
      will ever file. Percentage deductibles scale with home values, so they
      quietly grew far beyond the flat deductible you assumed you had.
    suggestion: Replace percentage deductibles with a flat per-occurrence
      dollar amount for every covered peril.
    fallback: "All deductibles are a fixed dollar amount per occurrence;
      percentage-based deductibles do not apply to any covered peril."
    check:
      kind: forbids_any
      patterns:
        - hurricane deductible.{0,40}(\d+%|percent)
        - windstorm deductible.{0,40}(\d+%|percent)
        - (wind|hurricane).{0,30}deductible.{0,30}equal to.{0,20}\d+%

  - id: mold-fungi-sublimit
    title: Mold/fungi coverage capped at a low sublimit
    severity: medium
    description: Mold, fungi, and rot remediation is limited to a small sublimit (commonly $10,000) instead of the full policy limits.
    why: Professional mold remediation routinely costs $15,000–$30,000
      once walls are opened and testing is done. A $10,000 sublimit means
      you pay most of a real remediation yourself — and mortgage lenders do
      not accept "the insurer wouldn't pay" as a reason to skip it.
    suggestion: Raise mold/fungi coverage to at least $50,000 per
      occurrence, or remove the separate sublimit entirely.
    fallback: "Mold, fungi, and rot remediation is covered up to $50,000
      per occurrence with no separate sublimit."
    check:
      kind: forbids_any
      patterns:
        - (mold|fungi).{0,80}\$10,000
        - mold.{0,60}sublimit
        - fungi.{0,60}sublimit

  - id: water-backup-excluded
    title: Sewer/drain water backup excluded with no endorsement
    severity: medium
    description: Loss from water backing up through sewers or drains, or overflowing from a sump pump, is excluded and no backup endorsement is included.
    why: Backup claims are among the most common homeowner losses —
      a failed sump pump during a storm can put feet of sewage water in a
      finished basement. The standard HO-3 excludes it; the endorsement
      that fixes it costs roughly $50–$150 a year.
    suggestion: Add the water-backup endorsement with at least $10,000 of
      coverage.
    fallback: "The policy includes water-backup coverage of at least
      $10,000 for loss caused by sewer, drain, or sump-pump backup."
    check:
      kind: forbids_any
      patterns:
        - water backup.{0,60}(excluded|not covered)
        - sewer.{0,20}(backup|discharge).{0,40}(excluded|not covered)
        - sump.{0,30}(pump|overflow).{0,40}(excluded|not covered)

  - id: loss-of-use-cap-low
    title: Additional living expense capped too low or too short
    severity: medium
    description: Loss-of-use coverage (additional living expense while your home is uninhabitable) is capped below 30% of the dwelling limit or under 24 months.
    why: A serious fire or rebuild takes 12–24 months, and rents spike
      exactly when a whole neighborhood is rebuilding. A 12-month cap
      runs out while you are still in temporary housing — then the rent
      comes out of your pocket.
    suggestion: Require additional living expense up to 30% of the
      Coverage A limit, payable for up to 24 months.
    fallback: "Additional living expense is covered up to 30% of the
      Coverage A limit, payable for up to 24 months after the loss."
    check:
      kind: requires_any
      patterns:
        - additional living expense.{0,80}(24 months|30%|30 percent)
        - loss of use.{0,80}(24 months|30%|30 percent)

  - id: insurer-right-to-repair
    title: Insurer can repair with its own contractors instead of paying cash
    severity: medium
    description: The insurer may choose to repair or rebuild with contractors of its choice rather than paying you a cash settlement.
    why: The insurer's contractors optimize for the insurer's cost, not
      your home's quality — cheaper materials, slower scheduling, and
      disputes you cannot easily escalate because the insurer is the
      customer, not you.
    suggestion: Require cash settlement at the approved estimate and let
      the policyholder choose the contractor.
    fallback: "Losses are settled in cash at the approved estimate; the
      policyholder selects the repair contractor."
    check:
      kind: forbids_any
      patterns:
        - right to repair
        - contractors of our choice
        - (insurer|we).{0,40}option.{0,20}repair

  - id: no-ordinance-or-law-coverage
    title: No ordinance-or-law coverage for building-code upgrades
    severity: low
    description: The policy does not cover the extra cost of bringing repairs up to current building codes.
    why: After a major loss, the building department can require code
      upgrades (electrical, seismic, energy) that add 10–25% to the rebuild
      cost. Without ordinance-or-law coverage, that surcharge is yours.
    suggestion: Add ordinance-or-law coverage of at least 25% of the
      Coverage A limit.
    fallback: "Ordinance-or-law coverage up to 25% of the Coverage A limit
      is included for required building-code upgrades."
    check:
      kind: requires_any
      patterns:
        - ordinance or law.{0,40}coverage
        - building code upgrade.{0,40}(covered|coverage|included)
        - law and ordinance.{0,40}(covered|coverage|included)
