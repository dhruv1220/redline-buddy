name: saas-vendor
version: 1
description: Red-flag rules for reviewing SaaS / vendor MSAs from the customer side.
rules:
  - id: liability-cap
    title: No limitation of liability
    severity: high
    description: The agreement has no clause capping either party's liability.
    why: Without a cap, a single incident (outage, data loss, breach) can expose you to uncapped damages far beyond what you paid.
    suggestion: Add mutual limitation of liability capped at 12 months of fees paid, excluding breaches of confidentiality and IP infringement.
    fallback: "Neither party's aggregate liability shall exceed the fees paid in the twelve (12) months preceding the claim, excluding breaches of confidentiality, IP infringement, and indemnification obligations."
    check:
      kind: requires_any
      patterns:
        - limitation of liability
        - liability.{0,40}shall not exceed
        - cap.{0,30}liabilit
        - liabilit.{0,30}cap

  - id: auto-renewal
    title: Auto-renewal without a clear opt-out
    severity: medium
    description: The term renews automatically with no stated way to decline renewal.
    why: Auto-renewals lock you into another term at the vendor's then-current pricing unless you catch the window.
    suggestion: Require 30 days' written notice of non-renewal, or remove auto-renewal entirely.
    fallback: "Either party may decline renewal by written notice at least thirty (30) days before the end of the then-current term; silence is not consent to renew."
    check:
      kind: forbids_unless
      patterns:
        - automatically renew
        - auto-renew
        - renew.{0,25}automatically
      unless_any:
        - non-renewal
        - not renew
        - opt.out
        - decline.{0,25}renew

  - id: termination-convenience
    title: No termination for convenience
    severity: medium
    description: You cannot exit the agreement except for the vendor's breach.
    why: If the product stops fitting, you're stuck paying for the full term.
    suggestion: Add termination for convenience with 30 days' notice and pro-rata refund of prepaid fees.
    fallback: "Customer may terminate this Agreement for convenience on thirty (30) days' written notice, with a pro-rata refund of prepaid fees for the remainder of the term."
    check:
      kind: requires_any
      patterns:
        - terminat.{0,50}convenience
        - terminate.{0,50}without cause

  - id: termination-notice
    title: Termination notice period is longer than 30 days
    severity: low
    description: Ending the agreement requires more than 30 days' notice.
    why: Long notice periods delay your exit and can push you into another billing cycle.
    suggestion: Reduce termination notice to 30 days.
    fallback: "Either party may terminate on thirty (30) days' written notice."
    check:
      kind: max_value
      group: value
      max: 30
      patterns:
        - (?P<value>\d{1,3})\D{0,8}days.{0,30}notice

  - id: mutual-indemnification
    title: One-sided indemnification
    severity: high
    description: You indemnify the vendor, but the vendor does not indemnify you.
    why: If the vendor's software infringes a third party's IP, you want them defending you — not the other way around only.
    suggestion: Make indemnification mutual, covering IP infringement claims at minimum.
    fallback: "Each party shall indemnify, defend, and hold harmless the other against third-party claims alleging infringement of intellectual property rights by that party's products or services."
    check:
      kind: forbids_unless
      patterns:
        - customer.{0,80}indemnif
        - client.{0,80}indemnif
      unless_any:
        - vendor.{0,80}indemnif
        - provider.{0,80}indemnif
        - mutual indemnification

  - id: confidentiality
    title: No confidentiality clause
    severity: medium
    description: The agreement has no confidentiality protections.
    why: You'll share business data with the vendor; without this, there's no contractual duty to protect it.
    suggestion: Add a mutual confidentiality clause with a 3-year survival period.
    fallback: "Each party shall keep the other's Confidential Information confidential for three (3) years from disclosure, using at least reasonable care, subject to standard exclusions."
    check:
      kind: requires_any
      patterns:
        - confidential information
        - confidentiality

  - id: ai-training-data
    title: Vendor may train AI models on your data
    severity: high
    description: The agreement lets the vendor use customer data to train machine-learning models.
    why: Your proprietary data, customer lists, and prompts can end up improving a model the vendor sells to your competitors — with no way to claw it back.
    suggestion: Prohibit use of customer data for model training; allow only aggregated, de-identified usage statistics if you agree.
    fallback: "Vendor shall not use Customer Data to train, retrain, or improve any machine-learning or AI model. Vendor may use only aggregated, de-identified usage statistics that do not identify Customer."
    check:
      kind: forbids_any
      patterns:
        - train.{0,40}(model|machine learning|\bai\b)
        - use.{0,40}customer data.{0,40}train
        - improve.{0,40}(model|service).{0,40}customer data

  - id: data-return-deletion
    title: No data return or deletion on exit
    severity: high
    description: The agreement says nothing about getting your data back or having it deleted when the contract ends.
    why: Without an exit clause, the vendor can hold your data hostage for a renewal, or keep it indefinitely after you leave.
    suggestion: Require data export in a standard format within 30 days of termination and deletion of all copies within 90 days.
    fallback: "Within thirty (30) days after termination, Vendor shall make Customer Data available for export in a standard format, and within ninety (90) days shall delete all copies of Customer Data from its systems."
    check:
      kind: requires_any
      patterns:
        - delet
        - return.{0,25}data
        - data.{0,25}export
        - data.{0,25}portab

  - id: sla-credits
    title: No uptime SLA or service credits
    severity: medium
    description: The agreement promises no uptime level and no credits if the service goes down.
    why: Without an SLA, chronic outages cost you the same as perfect uptime — you pay full price for a broken service.
    suggestion: Add a 99.9% monthly uptime commitment with service credits (e.g. 10% for each 1% below target).
    fallback: "Vendor commits to 99.9% monthly uptime, excluding scheduled maintenance. If uptime falls below target, Customer receives service credits of ten percent (10%) of monthly fees for each one percent (1%) shortfall."
    check:
      kind: requires_any
      patterns:
        - service level
        - \bsla\b
        - uptime
        - service credit

  - id: unilateral-terms-change
    title: Vendor can change the terms by posting to its website
    severity: medium
    description: The vendor may modify the agreement by posting new terms online.
    why: Terms that change by website posting mean the contract you signed is not the contract you live under — pricing, data rights, and SLAs can all shift without your signature.
    suggestion: Require amendments in a signed writing, or at minimum 30 days' emailed notice with a right to terminate if you object.
    fallback: "This agreement may be amended only by a written instrument signed by both parties. Vendor website postings do not amend this agreement."
    check:
      kind: forbids_any
      patterns:
        - may (modify|change|update).{0,40}terms.{0,40}(website|posting|notice)
        - terms.{0,30}updated by posting
        - posting.{0,30}to (its|the) website.{0,30}(amend|modify|change)
