[project]
name = "redline-buddy"
version = "0.1.0"
description = "Local-first contract red-flag checker: paste in a vendor MSA, get a plain-language risk memo. No API keys, no data leaves your machine."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dhruv Arora" }]
keywords = ["contracts", "legal-tech", "redlining", "playbook", "msa", "nda", "cli"]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "python-docx>=1.1", "pypdf>=6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/dhruv1220/redline-buddy"
Repository = "https://github.com/dhruv1220/redline-buddy"
Issues = "https://github.com/dhruv1220/redline-buddy/issues"

[project.scripts]
redline = "redline.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redline = ["playbooks/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
