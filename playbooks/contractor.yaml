name: contractor
version: 1
description: Red-flag rules for reviewing independent contractor / freelancer agreements from the hiring-company side.
rules:
  - id: ip-assignment
    title: No IP / work-product assignment
    severity: high
    description: The agreement does not assign intellectual property in the deliverables to the company.
    why: Without an assignment clause (or work-made-for-hire language), the contractor may retain ownership of what you paid them to build.
    suggestion: Add a present-tense assignment of all work product and IP to the company, plus a waiver of moral rights where applicable.
    check:
      kind: requires_any
      patterns:
        - assign.{0,40}intellectual property
        - work.{0,20}made for hire
        - work product.{0,40}assign
        - hereby assigns.{0,60}company

  - id: non-compete
    title: Hidden non-compete in a contractor agreement
    severity: high
    description: The agreement restricts the contractor from competing — unusual and often unenforceable for true contractors.
    why: Non-competes in contractor agreements raise misclassification risk and are void in several states; use a narrow non-solicitation instead if needed.
    suggestion: Remove the non-compete, or replace it with a time-boxed non-solicitation of employees and customers.
    check:
      kind: forbids_any
      patterns:
        - non-compete
        - noncompete
        - covenant not to compete
        - shall not (engage in|perform services for).{0,60}compet

  - id: payment-terms
    title: No clear payment terms
    severity: medium
    description: The agreement states no rate, invoicing cadence, or payment timeline.
    why: Vague payment terms are the top source of contractor disputes — agree on rate, invoice schedule, and net terms up front.
    suggestion: State the rate (hourly/fixed), invoicing cadence, and payment due date (e.g., net 30).
    check:
      kind: requires_any
      patterns:
        - \$ ?\d
        - per hour
        - fixed fee
        - net \d{1,2}
        - invoice.{0,30}within

  - id: termination-convenience
    title: Company cannot terminate at will
    severity: medium
    description: The company has no right to end the engagement except for the contractor's breach.
    why: If the work quality drops or priorities change, you need a clean exit — 7 to 15 days' notice is standard for contractors.
    suggestion: Add termination for convenience with 14 days' written notice and payment for work completed through the termination date.
    check:
      kind: requires_any
      patterns:
        - terminat.{0,50}convenience
        - terminate.{0,50}without cause
        - terminate.{0,50}at will
        - \d{1,3} days.{0,20}notice.{0,30}terminat

  - id: confidentiality
    title: No confidentiality obligation on the contractor
    severity: medium
    description: The contractor is not bound to keep company information confidential.
    why: Contractors routinely see roadmaps, code, and customer data — without a confidentiality clause you have no contractual protection.
    suggestion: Add a mutual confidentiality clause with standard exclusions and a 3-5 year survival period.
    check:
      kind: requires_any
      patterns:
        - confidential.{0,40}information
        - non-disclosure
        - shall not disclose

  - id: expenses
    title: Expenses reimbursable without pre-approval
    severity: low
    description: The agreement reimburses expenses with no pre-approval or cap requirement.
    why: Open-ended expense reimbursement invites surprise invoices; require written pre-approval for anything beyond a stated threshold.
    suggestion: Require prior written approval for expenses over $250 and itemized receipts for all reimbursement.
    check:
      kind: forbids_unless
      patterns:
        - expenses.{0,30}reimburs
        - reimburs.{0,30}expenses
      unless_any:
        - pre-approv
        - prior written (approval|consent)
        - approved in advance
